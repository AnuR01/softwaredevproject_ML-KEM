name: sdmo-pqc

services:
  cloud:
    build:
      context: .
      dockerfile: cloud_service/Dockerfile
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?copy .env.example to .env and set GATEWAY_TOKEN}
      LEGACY_INGEST_ENABLED: ${LEGACY_INGEST_ENABLED:-true}
      CLOUD_KEM_KEY_FILE: /keys/cloud_kem.json
      # One JSON object per log line; see observability/logs.py.
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - cloud-keys:/keys
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2));
          assert d['status']=='ok' and d['pqc']['algorithm']=='ML-KEM-768'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: edge_gateway/Dockerfile
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?copy .env.example to .env and set GATEWAY_TOKEN}
      CLOUD_URL: http://cloud:8000
      CLOUD_KEY_FINGERPRINT: ${CLOUD_KEY_FINGERPRINT:?set CLOUD_KEY_FINGERPRINT from cloud /health}
      CRYPTO_MODE: ${CRYPTO_MODE:-mlkem}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "127.0.0.1:9000:9000"
      # /health and /metrics. Published on the host's localhost only.
      - "127.0.0.1:9100:9100"
    depends_on:
      cloud:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        # Both servers must answer: the device port, and /health on the
        # admin port. "degraded" still counts as healthy here, because a
        # gateway whose cloud is down is not fixed by restarting it.
        - >-
          import json,socket,urllib.request;
          socket.create_connection(('127.0.0.1',9000),2).close();
          d=json.load(urllib.request.urlopen('http://127.0.0.1:9100/health', timeout=2));
          assert d['status'] in ('ok','degraded')
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  device:
    build:
      context: .
      dockerfile: legacy_device/Dockerfile
    environment:
      DEVICE_ID: ${DEVICE_ID:-dev-001}
      DEVICE_INTERVAL: ${DEVICE_INTERVAL:-2}
    command:
      - python
      - -m
      - legacy_device.device
      - --host
      - gateway
      - --port
      - "9000"
      - --device-id
      - ${DEVICE_ID:-dev-001}
      - --interval
      - ${DEVICE_INTERVAL:-2}
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cloud-keys:
    name: sdmo-pqc-cloud-keys
