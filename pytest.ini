[pytest]
testpaths = tests
# -ra prints a short summary of every non-passing test at the end, which is
# what CI logs are read for.
addopts = -ra
markers =
    security: demonstrates a weakness of the baseline system rather than
        guarding against one. Run just these with -m security when writing up
        the security findings for the report.
    failure: operational failure tests (cloud down, timeouts, bad replies,
        resource limits). Run just these with -m failure.
